<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在庫ノート</title>
<meta name="description" content="個人用の在庫管理アプリ。何が・どこに・いくつあるかを一目で。">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="在庫ノート">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="src/ui/styles.css">
<script>
  // 描画前にテーマを適用（ちらつき防止）
  try {
    var t = localStorage.getItem('zaiko.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
