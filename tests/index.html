<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在庫ノート 自動テスト</title>
<style>
  body { font: 14px/1.5 -apple-system, "Hiragino Sans", sans-serif; margin: 16px; color: #1c1c1e; background: #f6f6f3; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .sum { font-size: 16px; font-weight: 600; margin: 8px 0 16px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border-bottom: 1px solid #e5e5e0; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #efefea; font-size: 12px; }
  .pass { color: #0a7a52; font-weight: 600; }
  .fail { color: #c62828; font-weight: 600; }
  .suite td { background: #f0f4f2; font-weight: 600; }
  pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 11px; color: #c62828; }
  td.io { font-size: 12px; color: #555; }
</style>
</head>
<body>
<h1>在庫ノート 自動テスト</h1>
<div class="sum" id="sum">実行中…</div>
<table>
  <thead><tr><th>#</th><th>テスト</th><th>入力</th><th>期待結果</th><th>結果</th><th>ms</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script type="module">
  import { run } from './harness.js';
  import './core.test.js';
  import { cleanup } from './data.test.js';

  const tbody = document.getElementById('rows');
  let lastSuite = null, i = 0;
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const results = await run((r) => {
    if (r.suite !== lastSuite) {
      lastSuite = r.suite;
      tbody.insertAdjacentHTML('beforeend', `<tr class="suite"><td colspan="6">${esc(r.suite)}</td></tr>`);
    }
    tbody.insertAdjacentHTML('beforeend', `<tr><td>${++i}</td><td>${esc(r.name)}</td><td class="io">${esc(r.input)}</td><td class="io">${esc(r.expected)}</td><td class="${r.status}">${r.status === 'pass' ? '合格' : '不合格'}${r.error ? `<pre>${esc(r.error)}</pre>` : ''}</td><td>${r.ms}</td></tr>`);
  });
  for (const repo of cleanup) await repo.destroy().catch(() => {});
  const pass = results.filter((r) => r.status === 'pass').length;
  const fail = results.length - pass;
  document.getElementById('sum').innerHTML = `合計 ${results.length} 件：<span class="pass">合格 ${pass}</span> / <span class="fail">不合格 ${fail}</span>（${navigator.userAgent.match(/(Chrome|Safari|Firefox)\/[\d.]+/)?.[0] || ''} / ${new Date().toLocaleString('ja-JP')}）`;
  window.__TEST_RESULTS__ = results;
  document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script>
</body>
</html>
